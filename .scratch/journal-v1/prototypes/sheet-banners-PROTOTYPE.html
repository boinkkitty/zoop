<!doctype html>
<!--
  PROTOTYPE, throwaway. VERDICT (2026-11-25): B (Island) for Notices + F3 coach marks for Day 1, stack order and dismiss rules as below; see the ticket's Answer.
  Ticket: "Sheet banners and first run" (.scratch/journal-v1/issues/15-sheet-banners-and-first-run.md)
  Built on the T4 sheet (journal-page-v3), the R4 rail (island-rail) and search A (search-results). Search and the scrubber are drawn, not wired.
  Question: how do the quiet notices on the sheet look and stack, which can be dismissed, and what does a brand-new user see on Day 1?
  Plan: four structurally different placements for notices, switchable via ?variant=A|B|C|D, the ← / → keys (outside the editor) or the bottom bar.
    A  Strip on the sheet: tinted rows at the top of the sheet, stacked, sticky while you scroll.
    B  Island: one black pill hanging at the top of the sheet area, like the Dynamic Island. It shows the most urgent notice and "+N";
       hover expands it into the whole stack (Spring motion, like the rail).
    C  Header line: each notice is a small pill on the weekday line, next to "Today". The most urgent one spells itself out
       in one grey line under the date; click another pill to read it instead. The quietest.
    D  Split by scope: notices about this Page (changed elsewhere, not saved, closed at 02:00) sit on the sheet like A;
       notices about the account or app (verify email, timezone, update) sit in a card at the bottom of the sidebar.
  Second axis, first run (bar button "Day 1 hints"): F1 placeholders only + a faint ⌘/ hint, F2 a grey welcome note written on
  the sheet that vanishes on the first keystroke, F3 three coach marks shown once.
  Bar: scenario (Day 1 / usual day, at 00:40 so yesterday is in its Grace Window), toggles for each notice, window width, reset.
  Stack order (most urgent first): update → changed elsewhere → not saved → closed at 02:00 → timezone → verify email.
  No persistence. ⌘/ opens the shortcut sheet.
-->

    display: flex; align-items: center; gap: 4px; padding: 6px; font: 500 12px system-ui, sans-serif; box-shadow: 0 6px 24px rgba(0,0,0,.3); z-index: 99; }

<div id="frame"><div class="app" id="app">

  <div id="coach"></div>
  <div id="ks"><div class="box"><h3>Keyboard shortcuts</h3>
    <div class="k"><span><b>Bold</b></span><kbd>⌘B</kbd></div><div class="k"><span><i>Italic</i></span><kbd>⌘I</kbd></div><div class="k"><span><u>Underline</u></span><kbd>⌘U</kbd></div>
    <div class="k"><span>Highlight</span><kbd>⌘⇧H</kbd></div><div class="k"><span>Bullet list</span><kbd>⌘⇧8</kbd></div><div class="k"><span>Numbered list</span><kbd>⌘⇧7</kbd></div>
    <div class="k"><span>Checklist</span><kbd>⌘⇧9</kbd></div><div class="k"><span>Quote</span><kbd>⌘⇧B</kbd></div><div class="k"><span>Search</span><kbd>⌘K</kbd></div>
    <div class="k"><span>This sheet</span><kbd>⌘/</kbd></div></div></div>
</div></div>
<div id="bar"><span>PROTOTYPE</span><button id="prev">←</button><button id="vn"></button><button id="next">→</button>
  <button id="scen"></button><button id="fr"></button><button id="narrow"></button><button id="reset">Reset</button>
  <i class="brk"></i><span>Notices</span><span id="tg"></span><span id="order"></span></div>
<script>
// ----- fake clock: 00:40 on Wed 25 Nov 2026, so yesterday is in its Grace Window -----
const TODAY = new Date(2026, 10, 25), NBS = ['My Journal', 'I Learned'];
const fmt = (d, o) => d.toLocaleDateString('en-GB', o);
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const TITLES = ['Rain all day', 'Long call with Mum', 'First frost', 'Shipped the thing', 'Swim', 'Sunday market', 'Soup weather', 'Back on the bike', 'Quiet one', 'Fog on the river'];
const SENT = ['Stayed in and read most of the afternoon.', 'Made soup from whatever was left in the fridge, which was mostly leeks.', 'Mum is thinking about selling the house.',
  'The car windscreen was white at seven.', 'Forty lengths at the pool, slower than last week.', 'Walked to the market and bought too many clementines.', 'The fog sat on the river until noon.'];
function usualDays() { // signup 14 Sep 2026
  const out = [];
  for (let d = new Date(TODAY), i = 0; d >= new Date(2026, 8, 14); d.setDate(d.getDate() - 1), i++) {
    const has = i === 1 || (i > 1 && (i * 7) % 5 !== 0);
    const jt = i === 0 ? '' : has ? TITLES[i % TITLES.length] + '\n' + [SENT[i % 7], SENT[(i + 3) % 7]].join(' ') : '';
    out.push({ date: new Date(d), i, pages: { 'My Journal': jt, 'I Learned': has && i % 2 ? 'Today I learned\nOctopuses taste with their arms.' : '' } });
  }
  return out;
}
const firstDays = () => [{ date: new Date(TODAY), i: 0, pages: { 'My Journal': '', 'I Learned': '' } }];

// ----- notices -----
const ORDER = ['update', 'conflict', 'unsaved', 'locked', 'tz', 'verify'];
const NOTE = {
  update:   { scope: 'app',  tone: 'warn', short: 'Update ready', label: 'Zoop was updated',
              text: () => 'Zoop was updated. <em>Reload to keep saving. What you wrote is kept on this device.</em>', acts: [['Reload', 1, 'clear']], x: false },
  conflict: { scope: 'page', tone: 'act', short: 'Changed elsewhere', label: 'Changed on another device',
              text: () => 'This Page changed on another device.', acts: [['Keep this version', 1, 'clear'], ['Use the other', 0, 'other']], x: false },
  unsaved:  { scope: 'page', tone: 'warn', short: 'Not saved', label: 'Not saved',
              text: () => `Not saved, retrying in ${S.retry}s. <em>Your words are kept on this device.</em>`, acts: [['Try now', 0, 'clear']], x: false },
  locked:   { scope: 'page', tone: 'info', short: 'Closed at 02:00', label: 'Day closed',
              text: () => 'Yesterday closed at 02:00. <em>Everything you wrote is saved.</em>', acts: [['Go to today', 1, 'today']], x: true },
  tz:       { scope: 'app',  tone: 'act', short: 'Tokyo time?', label: 'Timezone',
              text: () => 'Looks like you’re on Tokyo time. <em>Start your Days on Tokyo time from tomorrow?</em>', acts: [['Switch', 1, 'clear'], ['Keep London', 0, 'clear']], x: false },
  verify:   { scope: 'app',  tone: 'info', short: 'Verify email', label: 'Verify email',
              text: () => 'Check your inbox to verify <b>you@example.com</b>.', acts: [['Resend', 0, 'resent']], x: true },
};
const V = { A: 'Strip on the sheet', B: 'Island', C: 'Header line', D: 'Split by scope' }, VK = Object.keys(V);
const FR = { F1: 'placeholders + ⌘/ hint', F2: 'welcome note on the sheet', F3: 'coach marks' };
const qv = new URLSearchParams(location.search).get('variant');
const S = { v: VK.includes(qv) ? qv : 'A', scen: 'first', fr: 'F1', narrow: false, dopen: false, sel: 0, nb: 'My Journal', on: {}, cPick: null, coach: 0, retry: 4, resent: false, days: [] };
function setScen(sc) {
  S.scen = sc; S.days = sc === 'first' ? firstDays() : usualDays(); S.sel = 0; S.nb = 'My Journal'; S.coach = 0; S.cPick = null; S.resent = false;
  S.on = sc === 'first' ? { verify: true } : { tz: true, unsaved: true, conflict: true };
}
const day = () => S.days[S.sel];
const editable = () => day().i === 0 || (day().i === 1 && !S.on.locked);
function visible() {
  return ORDER.filter(id => S.on[id] && !(id === 'locked' && day().i !== 1));
}
function act(id, what) {
  if (what === 'resent') { S.resent = true; NOTE.verify.text = () => 'Sent again. <em>Check your inbox for <b>you@example.com</b>.</em>'; render(); return; }
  if (what === 'other') day().pages[S.nb] = (day().pages[S.nb] || 'From the other device') + '\nA line typed on the laptop.';
  if (what === 'today') { S.sel = 0; }
  S.on[id] = false; render();
}
const btns = (id, cls = '') => NOTE[id].acts.map(([l, p, w]) => `<button class="nbtn ${p ? 'pri' : ''} ${cls}" data-n="${id}" data-w="${w}">${l}</button>`).join('')
  + (NOTE[id].x ? `<button class="nx" data-n="${id}" data-w="dismiss" title="Dismiss">×</button>` : '');

function stripHTML(ids) { // A, and D's Page half
  if (!ids.length) return '';
  return `<div class="nA">${ids.map(id => `<div class="nrow tone-${NOTE[id].tone}"><i class="ndot"></i><div class="ntx">${NOTE[id].text()}</div><div class="nact">${btns(id)}</div></div>`).join('')}</div>`;
}
function islandHTML(ids) { // B
  if (!ids.length) return '';
  const [a, ...rest] = ids, row = id => `<div class="brow tone-${NOTE[id].tone}"><i class="ndot"></i><div class="ntx">${NOTE[id].text()}</div>${btns(id)}</div>`;
  return `<div class="bI">${row(a).replace('</div><button', `</div>${rest.length ? `<span class="cnt">+${rest.length}</span>` : ''}<button`)}
    ${rest.length ? `<div class="rest"><div>${rest.map(row).join('')}</div></div>` : ''}</div>`;
}
function headerPills(ids) { // C
  if (!ids.length) return { pills: '', line: '' };
  const pick = ids.includes(S.cPick) ? S.cPick : ids[0];
  return {
    pills: ids.map(id => `<button class="cp tone-${NOTE[id].tone} ${id === pick ? 'on' : ''}" data-pick="${id}"><i class="ndot"></i>${NOTE[id].short}</button>`).join(''),
    line: `<div class="cline"><span class="ntx">${NOTE[pick].text()}</span>${btns(pick)}</div>`,
  };
}
function sideCards(ids) { // D's app half
  return ids.map(id => `<div class="dcard tone-${NOTE[id].tone}"><div class="top"><i class="ndot"></i><div class="ntx">${NOTE[id].text()}</div>${NOTE[id].x ? `<button class="nx" data-n="${id}" data-w="dismiss">×</button>` : ''}</div>
    <div class="nact">${NOTE[id].acts.map(([l, p, w]) => `<button class="nbtn ${p ? 'pri' : ''}" data-n="${id}" data-w="${w}">${l}</button>`).join('')}</div></div>`).join('');
}

// ----- rail -----
const title = d => d.pages['My Journal'].split('\n')[0];
const written = d => NBS.some(n => d.pages[n].trim());
const label = d => d.i === 0 ? 'Today' : d.i === 1 ? 'Yesterday' : fmt(d.date, { weekday: 'short', day: 'numeric' });
function renderRail() {
  let h = '', m = null;
  for (const d of S.days) {
    const mk = fmt(d.date, { month: 'long', year: 'numeric' }); if (mk !== m) { h += `<div class="month">${mk}</div>`; m = mk; }
    const grace = S.scen === 'usual' && d.i === 1 && !S.on.locked;
    h += `<div class="slot ${written(d) ? '' : 'empty'} ${d.i === S.sel ? 'sel' : ''}" data-i="${d.i}"><div class="isl"><div class="row0"><span class="d">${label(d)}</span>${grace ? '<i class="gdot"></i>' : ''}<span class="sep"></span><span class="t">${esc(title(d))}</span></div></div></div>`;
  }
  const first = S.days[S.days.length - 1].date;
  h += `<div class="railend">You started here · ${S.scen === 'first' ? 'today' : fmt(first, { day: 'numeric', month: 'long', year: 'numeric' })}</div>`;
  if (S.scen === 'first' && S.fr !== 'F1') h += `<div class="railhint">Every Day gets an Island here. Its Title is the first line you write.</div>`;
  document.getElementById('rail').innerHTML = h;
}

// ----- page -----
function placeholder() {
  if (written(day()) && day().pages[S.nb].trim()) return '';
  if (!editable()) return `<div class="phl"><p>Nothing written on this Day.</p></div>`;
  const j = S.nb === 'My Journal';
  if (S.scen === 'first' && S.fr === 'F2') return `<div class="phl">${j ? `<div class="pt">Title</div>
    <div class="ww"><p>Welcome to Zoop. This is today’s Page. Write anything; it saves as you type.</p>
    <p>The <b>first line</b> becomes the Day’s Title. It turns bold here and shows on today’s Island on the left.</p>
    <p>On the right edge are two Notebooks: <b>My Journal</b> for your day, <b>I Learned</b> for one thing you picked up.</p>
    <p>You can keep writing until <b>02:00</b>; after that the Day closes and a new one starts. Press <b>⌘/</b> for formatting shortcuts.</p>
    <p>This note disappears when you start typing.</p></div>` : `<div class="ww"><p>I Learned is a second Page for every Day: one thing you found out, however small.</p></div>`}</div>`;
  return `<div class="phl">${j ? '<div class="pt">Title</div><p>Write about your day…</p>' : '<p>What did you learn today?</p>'}</div>`;
}
function renderPage() {
  const d = day(), w = editable(), text = d.pages[S.nb] || '', ids = visible();
  const pageIds = S.v === 'D' ? ids.filter(id => NOTE[id].scope === 'page') : ids;
  const C = S.v === 'C' ? headerPills(ids) : { pills: '', line: '' };
  const grace = S.scen === 'usual' && d.i === 1 && w;
  const status = d.i === 0 ? '' : grace ? '<span class="badge open"><i class="gdot"></i>Still open until 02:00</span>' : '<span class="badge">Read only</span>';
  const lines = (text ? text.split('\n') : ['']).map(l => `<div>${l ? esc(l) : '<br>'}</div>`).join('');
  document.getElementById('main').innerHTML = `
    <button id="hamb" title="Days" style="position:absolute"><svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg>${S.v === 'D' && ids.some(id => NOTE[id].scope === 'app') ? '<i class="hdot"></i>' : ''}</button>
    <div class="sheet ${w ? '' : 'ro'} ${S.nb === 'My Journal' ? '' : 'notitle'}">
      ${S.v === 'A' || S.v === 'D' ? stripHTML(pageIds) : ''}
      <div class="head"><div class="dow">${fmt(d.date, { weekday: 'long' })}${d.i === 0 ? ' · Today' : ''}${status}${C.pills}</div>
        <div class="date">${fmt(d.date, { day: 'numeric', month: 'long', year: 'numeric' })}</div>${C.line}</div>
      <div class="edwrap"><div class="ed" ${w ? 'contenteditable="true" spellcheck="false"' : ''}>${lines}</div>${placeholder()}</div>
      ${S.scen === 'first' && S.fr === 'F1' ? '<div class="slashhint"><kbd>⌘/</kbd> shortcuts</div>' : ''}
      <div class="tabs">${NBS.map(n => `<div class="tab ${n === S.nb ? 'on' : ''}" data-nb="${n}">${n}</div>`).join('')}<div class="tab plus">+</div></div>
    </div>`;
  document.getElementById('layerB').innerHTML = S.v === 'B' ? islandHTML(ids) : '';
  document.getElementById('nD').innerHTML = S.v === 'D' ? sideCards(ids.filter(id => NOTE[id].scope === 'app')) : '';
  document.getElementById('hamb').onclick = () => { S.dopen = true; shell(); };
  document.querySelectorAll('.tab[data-nb]').forEach(t => t.onclick = () => { S.nb = t.dataset.nb; render(); });
  const ed = document.querySelector('.ed[contenteditable]');
  if (ed) ed.oninput = () => {
    const was = !!d.pages[S.nb].trim(); d.pages[S.nb] = ed.innerText.replace(/\n$/, '');
    const now = !!d.pages[S.nb].trim(); document.querySelector('.phl')?.style.setProperty('display', now ? 'none' : '');
    if (now && S.scen === 'first' && S.fr === 'F3') { S.coach = 9; renderCoach(); }
    if (was !== now || S.nb === 'My Journal') renderRail();
  };
}

// ----- F3 coach marks -----
const COACH = [
  { tgt: '.edwrap', side: 'pl', b: 'Today’s Page', t: 'Just start writing. It saves as you type. The first line becomes the Day’s Title and turns bold.' },
  { tgt: '.tabs', side: 'pr', b: 'Two Notebooks', t: '<b style="display:inline">My Journal</b> for your day, <b style="display:inline">I Learned</b> for one thing you found out. Each has its own Page every Day.' },
  { tgt: '.slot', side: 'pl', b: 'Your Days', t: 'Each Day gets an Island here, with its Title. You can write until 02:00, then the Day closes. <kbd>⌘/</kbd> shows formatting shortcuts.' },
];
function renderCoach() {
  const el = document.getElementById('coach');
  if (S.scen !== 'first' || S.fr !== 'F3' || S.coach >= COACH.length || (S.narrow && COACH[S.coach].tgt === '.slot' && !S.dopen)) { el.innerHTML = ''; return; }
  const c = COACH[S.coach], t = document.querySelector(c.tgt); if (!t) return;
  const r = t.getBoundingClientRect(), f = document.getElementById('frame').getBoundingClientRect();
  let x, y = r.top - f.top + 6, side = c.side;
  if (c.tgt === '.edwrap') { x = r.left - f.left + 180; y = r.top - f.top + 46; side = 'pt'; }
  else if (side === 'pr') { x = r.left - f.left - 262; y = r.top - f.top + 110; } else x = r.right - f.left + 12;
  el.innerHTML = `<div class="coach ${side}" style="left:${x}px;top:${y}px"><b>${c.b}</b>${c.t}<div class="cf"><span>${S.coach + 1} of ${COACH.length}</span>
    <span><button class="sk" id="cskip">Skip</button><button id="cnext">${S.coach === COACH.length - 1 ? 'Got it' : 'Next'}</button></span></div></div>`;
  document.getElementById('cnext').onclick = () => { S.coach++; renderCoach(); };
  document.getElementById('cskip').onclick = () => { S.coach = 9; renderCoach(); };
}

// ----- shell + bar -----
function renderNav() {
  const ic = d => `<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">${d}</svg>`;
  document.getElementById('navtop').innerHTML = `<div class="nav"><a class="on">${ic('<path d="M2 7.5 8 2.5l6 5V14H10v-4H6v4H2z"/>')}Home</a>
    <a>${ic('<circle cx="8" cy="8" r="5.5"/>')}Filler 1</a><a>${ic('<circle cx="8" cy="8" r="5.5"/>')}Filler 2</a></div>
    <div class="search"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="7" r="5"/><path d="m11 11 4 4"/></svg><span>Search</span><kbd>⌘K</kbd></div><div class="navdiv"></div>`;
}
function shell() {
  document.getElementById('frame').className = S.narrow ? 'narrow' : '';
  document.getElementById('app').className = ['app', S.narrow ? 'narrow' : '', S.dopen ? 'dopen' : ''].join(' ');
  setTimeout(renderCoach, S.narrow ? 380 : 0);
}
function bar() {
  document.getElementById('vn').textContent = `${S.v} · ${V[S.v]}`;
  document.getElementById('scen').textContent = S.scen === 'first' ? 'Scenario: Day 1 (brand-new user)' : 'Scenario: usual day, 00:40';
  const fr = document.getElementById('fr'); fr.textContent = `Day 1 hints: ${S.fr} ${FR[S.fr]}`; fr.style.display = S.scen === 'first' ? '' : 'none';
  document.getElementById('narrow').textContent = S.narrow ? 'Window: 760px (drawer)' : 'Window: wide';
  document.getElementById('tg').innerHTML = ORDER.map(id => `<button class="${S.on[id] ? '' : 'off'}" data-t="${id}">${NOTE[id].label}</button>`).join(' ');
  const vis = visible();
  document.getElementById('order').textContent = vis.length ? 'showing: ' + vis.map(id => NOTE[id].short).join(' › ') : 'no notices';
  document.querySelectorAll('#tg button').forEach(b => b.onclick = () => {
    const id = b.dataset.t; S.on[id] = !S.on[id];
    if (id === 'locked' && S.on.locked) { if (S.scen === 'first') setScen('usual'), S.on.locked = true; S.sel = 1; }
    if (id === 'verify') { S.resent = false; NOTE.verify.text = () => 'Check your inbox to verify <b>you@example.com</b>.'; }
    render();
  });
}
function render() { renderRail(); renderPage(); bar(); shell(); }
function setVariant(v) { S.v = v; history.replaceState(null, '', '?variant=' + v); render(); }
const cyc = n => setVariant(VK[(VK.indexOf(S.v) + n + VK.length) % VK.length]);
document.getElementById('prev').onclick = () => cyc(-1);
document.getElementById('next').onclick = () => cyc(1);
document.getElementById('vn').onclick = () => cyc(1);
document.getElementById('scen').onclick = () => { setScen(S.scen === 'first' ? 'usual' : 'first'); render(); };
document.getElementById('fr').onclick = () => { S.fr = { F1: 'F2', F2: 'F3', F3: 'F1' }[S.fr]; setScen('first'); render(); };
document.getElementById('narrow').onclick = () => { S.narrow = !S.narrow; S.dopen = false; render(); };
document.getElementById('reset').onclick = () => { setScen(S.scen); render(); };
document.getElementById('rail').onclick = e => { const s = e.target.closest('.slot'); if (s) { S.sel = +s.dataset.i; S.dopen = false; render(); } };
document.getElementById('scrim').onclick = () => { S.dopen = false; shell(); };
document.getElementById('frame').addEventListener('click', e => {
  const b = e.target.closest('[data-n]'); if (b) { e.preventDefault(); return b.dataset.w === 'dismiss' ? (S.on[b.dataset.n] = false, render()) : act(b.dataset.n, b.dataset.w); }
  const p = e.target.closest('[data-pick]'); if (p) { S.cPick = p.dataset.pick; renderPage(); }
});
document.getElementById('ks').onclick = e => { if (e.target.id === 'ks') e.currentTarget.classList.remove('on'); };
addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === '/') { e.preventDefault(); document.getElementById('ks').classList.toggle('on'); return; }
  if (e.key === 'Escape') document.getElementById('ks').classList.remove('on');
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cyc(-1);
  if (e.key === 'ArrowRight') cyc(1);
});
addEventListener('resize', renderCoach);
setInterval(() => { // "Not saved" counts down and retries with backoff; the text updates in place
  if (!S.on.unsaved) return; S.retry = S.retry <= 1 ? 8 : S.retry - 1;
  document.querySelectorAll('.ntx').forEach(n => { if (n.textContent.startsWith('Not saved')) n.innerHTML = NOTE.unsaved.text(); });
}, 1000);
setScen('first'); renderNav(); render();
</script>
</body>
</html>
