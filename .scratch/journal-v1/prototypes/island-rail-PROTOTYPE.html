  PROTOTYPE, throwaway. VERDICT (2026-11-25): R4 + scrubber S3, Grace marker dot, D1 drawer, Spring motion, 150ms delay; see the ticket's Answer.
  Ticket: "Island rail and hover expansion" (.scratch/journal-v1/issues/06-island-rail-prototype.md)
  Built on T4 of journal-page-v3-PROTOTYPE.html (the page itself is unchanged; only the left rail varies).
  Plan: three structurally different rails, switchable via ?variant=R1|R2|R3, the ← / → keys or the bottom bar.
    R1  Timeline: newest first, sticky month headers; click a header → month picker (jump-to-month); Grace = pulsing green dot.
    R2  Diary: oldest first, anchored at the bottom with Today last (chat-style); month scrubber on the right edge; Grace = green ring + "48m left".
    R3  Months: newest first, one accordion per month (current month open), dot strip per closed month; Grace = draining bar.
    R4  (round 2, after user picked "R1 newest first with scrubber") R1's newest-first timeline + sticky headers, R2's scrubber (newest month at top,
        current month highlighted while scrolling) instead of the month picker. Grace marker switchable via the bar (dot / ring / bar).
  Round 3 (user: "the scrubber, when it gets really long what happens?"): History control fakes 3 / 10 / 25 years of Days.
    S1  Continuous: ticks thin out (only year ticks below 3px per month), year labels thin out (every Nth year), drag or hover anywhere
        to get a bubble naming the month under the pointer, release or click to jump.
    S2  Years: one segment per year; hovering a year opens a 12-month grid beside it; click a month to jump.
    S3  (round 4, user: "first 2 years of S1, so this year and last year, afterwards back [to years]") months for this calendar year and last,
        then one segment per older year (hover → 12-month grid). Slots ≤ 18px, shrinking so the whole scrubber always fits the rail.
    S4  Same as S3 but with fixed 16px slots, and the scrubber scrolls on its own when it runs out of room (to judge whether that looks bad).
  Jumps no longer load every Day in between: the rail shows a window starting at the target month and loads newer Days upward on scroll.
  Bottom bar also toggles: Grace Window, a simulated narrow (760px) window with two drawer styles (D1 slide-over, D2 mini rail),
  hover delay (0 / 150 / 300ms) and motion curve. No persistence; edits live in memory until reload.
-->

let SIGNUP;

const J = [
  ['Finally fixed the bike chain', 'Spent most of the morning with grease up to my elbows. It turned out the derailleur was bent, not the chain. Walked to the market after and bought too many clementines.'],
  ['Rain all day', 'Stayed in and read. Made soup from whatever was left in the fridge, which was mostly leeks.'],

let days, byMonth, MONTHS;
function gen(years) {
SIGNUP = years === 3 ? new Date(2024, 0, 8) : new Date(TODAY.getFullYear() - years, 0, 8);
days = []; byMonth = {};
for (let d = new Date(TODAY), i = 0; d >= SIGNUP; d.setDate(d.getDate() - 1), i++) {
  const r = (i * 7919) % 13, has = i < 2 || r > 3, hasL = has && r % 3 !== 0;

  days.push(day); (byMonth[day.k] ||= []).push(day);

}
gen(3);

const S = { v: VK.includes(qv) ? qv : 'R4', loaded: BATCH, sel: 0, nb: 'My Journal', grace: true, narrow: false, drawer: 'D1', dopen: false,
  hd: 150, ease: 0, years: 3, sm: 'S3', from: 0, openMonths: new Set([MONTHS[0]]), monthLoaded: new Set([MONTHS[0]]), picker: false };
let loading = false, io = null;

const fmt = (d, o) => d.toLocaleDateString('en-GB', o);
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
const title = day => day.pages['My Journal'].split('\n')[0];
const written = day => NBS.some(n => day.pages[n]);
const writable = day => day.i === 0 || (day.i === 1 && S.grace);
const glimpse = t => { const s = t.replace(/\n/g, ' · '); return s.length > 80 ? s.slice(0, 80).trimEnd() + '…' : s; };
const mname = (k, o = { month: 'long', year: 'numeric' }) => fmt(new Date(Math.floor(k / 12), k % 12, 1), o);

function island(day) {
  const filled = NBS.filter(n => day.pages[n]), g = S.grace && day.i === 1;
  const label = day.i === 0 ? 'Today' : day.i === 1 ? 'Yesterday' : fmt(day.date, { weekday: 'short', day: 'numeric' });
  let mark = '', cls = '', bar = '';
  const G = S.g;
  if (g && G === 'dot') mark = '<span class="gdot"></span>';
  if (g && G === 'ring') { mark = '<span class="gleft">48m left</span>'; cls = 'ring'; }
  if (g && G === 'bar') { mark = '<span class="otag">open</span>'; bar = '<span class="gbar" style="width:40%"></span>'; }
  return `<div class="slot ${filled.length ? '' : 'empty'} ${day.i === S.sel ? 'sel' : ''} ${g ? 'grace' : ''} ${cls}" data-i="${day.i}">
    <div class="isl">
      <div class="row0"><span class="dn">${day.date.getDate()}</span><span class="d">${label}</span><span class="sep"></span><span class="t">${esc(title(day))}</span>${mark}</div>
      <div class="more"><div>
        ${g ? '<div class="gopen">Still open until 02:00 · 48 min left</div>' : ''}
        ${filled.map(n => `<div class="nbrow"><b>${n}</b><span>${esc(glimpse(day.pages[n]))}</span></div>`).join('')}
      </div></div>${bar}
    </div></div>`;
}
const monthHead = k => `<div class="month" data-mk="${k}" data-s="${mname(k, { month: 'short' })}">${mname(k)}</div>`;
const shimmer = n => '<div class="ph"></div>'.repeat(n);

function railHTML() {
  if (S.v === 'R3') {
    return MONTHS.map(k => {
      const ds = byMonth[k], open = S.openMonths.has(k), w = ds.filter(written).length;
      const body = !open ? '' : S.monthLoaded.has(k) ? ds.map(island).join('') : shimmer(Math.min(ds.length, 6));
      return `<div class="mg ${open ? 'open' : ''}" data-mk="${k}">
        <div class="mh"><span class="mshort">${mname(k, { month: 'short' })}</span><span class="mn">${mname(k, k >= MONTHS[0] - TODAY.getMonth() ? { month: 'long' } : undefined)}</span><span class="mc">${w} of ${ds.length}</span><span class="chev">›</span></div>
        <div class="strip">${[...ds].reverse().map(d => `<span class="dd ${written(d) ? 'w' : ''}" data-i="${d.i}" title="${fmt(d.date, { weekday: 'short', day: 'numeric', month: 'short' })}${title(d) ? ' · ' + esc(title(d)) : ''}"></span>`).join('')}</div>
        <div class="mbody">${body}</div></div>`;
    }).join('') + `<div class="railend">You started here · ${fmt(SIGNUP, { day: 'numeric', month: 'long', year: 'numeric' })}</div>`;
  }
  const from = S.v === 'R2' ? 0 : S.from;
  let list = days.slice(from, S.loaded);
  if (S.v === 'R2') list = list.reverse();
  let html = '', month = null;
  for (const day of list) { if (day.k !== month) { html += monthHead(day.k); month = day.k; } html += island(day); }
  const more = S.loaded < days.length;
  const end = `<div class="railend">You started here · ${fmt(SIGNUP, { day: 'numeric', month: 'long', year: 'numeric' })}</div>`;
  const sent = `<div id="sentinel">${shimmer(3)}</div>`;
  const top = from > 0 ? `<div id="sentinelTop">${shimmer(3)}</div>` : '';
  return S.v === 'R2' ? (more ? sent : end) + html : top + html + (more ? sent : end);
}

function renderRail(keepBottom) {
  const rail = document.getElementById('rail'), st = rail.scrollTop;
  rail.innerHTML = railHTML() + (S.picker ? '' : '');
  rail.scrollTop = keepBottom != null ? rail.scrollHeight - keepBottom : st;
  if (io) io.disconnect();
  io = new IntersectionObserver(es => {
    const e = es.find(x => x.isIntersecting);
    if (!e || loading) return;
    loading = true;
    setTimeout(() => { // pretend API page fetch: older Days below, or newer Days above after a jump
      const fromBottom = rail.scrollHeight - rail.scrollTop;
      if (e.target.id === 'sentinelTop') { S.from = Math.max(0, S.from - BATCH); loading = false; renderRail(fromBottom); }
      else { S.loaded += BATCH; loading = false; renderRail(S.v === 'R2' ? fromBottom : null); }
      updateBar();
    }, 350);
  }, { root: rail, rootMargin: '300px' });
  ['sentinel', 'sentinelTop'].forEach(id => { const el = document.getElementById(id); if (el) io.observe(el); });
  renderScrub(); renderPicker(); markScrub();
}
let G = null; // scrubber geometry: items[] top-to-bottom, each { t: 'm', k } or { t: 'y', y }, with a slot height
const SM = { S1: 'S1 continuous', S2: 'S2 years', S3: 'S3 2y months + years, fits', S4: 'S3 but scrolls' };
function curMonth() {
  const rail = document.getElementById('rail');
  let k = null;
  for (const h of rail.querySelectorAll('.month')) { if (h.offsetTop <= rail.scrollTop + 12) k = +h.dataset.mk; else break; }
  return k ?? +rail.querySelector('.month')?.dataset.mk;
}
function posOf(k) {
  const j = G.items.findIndex(it => it.t === 'm' ? it.k === k : it.y === Math.floor(k / 12));
  const it = G.items[j];
  return j * G.slot + (it.t === 'm' ? .5 : ((11 - k % 12) + .5) / 12) * G.slot;
}
function markScrub() {
  const now = document.querySelector('#scrub .now');
  if (!now || !G) return;
  const t = posOf(curMonth()); now.style.top = t - 1 + 'px';
  const el = document.getElementById('scrub'); // S4: keep the marker in view
  if (G.scroll && (t < el.scrollTop + 20 || t > el.scrollTop + el.clientHeight - 20)) el.scrollTop = t - el.clientHeight / 2;
}
document.getElementById('rail').addEventListener('scroll', markScrub);
addEventListener('resize', () => { renderScrub(); markScrub(); });

function renderScrub() {
  const el = document.getElementById('scrub');
  el.classList.toggle('scrolls', S.v === 'R4' && S.sm === 'S4');
  if (S.v !== 'R2' && S.v !== 'R4') { el.innerHTML = ''; G = null; return; }
  const H = el.clientHeight, yl = y => '’' + String(y).slice(2), mode = S.v === 'R4' ? S.sm : 'S1';
  const list = S.v === 'R4' ? MONTHS : [...MONTHS].reverse(), yrs = [...new Set(MONTHS.map(k => Math.floor(k / 12)))];
  let items;
  if (mode === 'S1') items = list.map(k => ({ t: 'm', k }));
  else if (mode === 'S2') items = yrs.map(y => ({ t: 'y', y }));
  else { const cut = (TODAY.getFullYear() - 1) * 12; items = [...MONTHS.filter(k => k >= cut).map(k => ({ t: 'm', k })), ...yrs.filter(y => y * 12 < cut).map(y => ({ t: 'y', y }))]; }
  const slot = mode === 'S4' ? 16 : mode === 'S3' ? Math.min(18, H / items.length) : H / items.length;
  G = { items, slot, scroll: mode === 'S4' };
  let html = '', lastLab = -99;
  items.forEach((it, j) => {
    const top = j * slot, t = top + slot / 2;
    if (it.t === 'y') {
      html += `<div class="ys" data-y="${it.y}" style="top:${top}px;height:${slot}px"></div><i class="tk yt" style="top:${top}px;width:8px"></i>`;
      if (t - lastLab >= 11) { html += `<span class="y" style="top:${t}px">${yl(it.y)}</span>`; lastLab = t; }
      return;
    }
    const k = it.k, prev = items[j - 1], ys = !prev || Math.floor(prev.k / 12) !== Math.floor(k / 12);
    const ds = byMonth[k], dens = ds.filter(written).length / ds.length;
    if (slot >= 3 || ys) html += `<i class="tk ${ys ? 'yt' : ''}" style="top:${t}px;width:${ys ? 8 : 4 + dens * 6}px"></i>`;
    if (ys && t - lastLab >= 15) { html += `<span class="y" style="top:${t}px">${yl(Math.floor(k / 12))}</span>`; lastLab = t; }
  });
  el.innerHTML = html + `<div style="height:${items.length * slot}px"></div>` + (S.v === 'R4' ? '<span class="now"></span>' : '');
}
(() => { // scrubber pointer handling: month slots show a bubble and jump on release; year slots open a 12-month grid
  const el = document.getElementById('scrub'), bub = document.getElementById('sbub'), pop = document.getElementById('ypop');
  let drag = false, k = null, hide = null;
  const yIn = e => Math.max(0, Math.min(G.items.length * G.slot - 1, e.clientY - el.getBoundingClientRect().top + el.scrollTop));
  const hit = y => G.items[Math.min(G.items.length - 1, Math.floor(y / G.slot))];
  const vis = y => el.offsetTop + y - el.scrollTop;
  const showPop = (yr, y) => {
    clearTimeout(hide);
    el.querySelectorAll('.ys').forEach(s => s.classList.toggle('hot', +s.dataset.y === yr));
    let h = `<b>${yr}</b><div class="gr">`;
    for (let m = 0; m < 12; m++) { const mk2 = yr * 12 + m, ds = byMonth[mk2];
      h += `<div class="mo ${ds ? '' : 'off'}" data-mk="${mk2}">${mname(mk2, { month: 'short' })}${ds ? `<i style="opacity:${ds.filter(written).length / ds.length}"></i>` : ''}</div>`; }
    pop.innerHTML = h + '</div>'; pop.dataset.y = yr; pop.classList.add('on');
    pop.style.top = Math.max(0, Math.min(vis(y) - 60, el.offsetTop + el.clientHeight - pop.offsetHeight)) + 'px';
  };
  const hidePop = () => { clearTimeout(hide); hide = setTimeout(() => { pop.classList.remove('on'); el.querySelectorAll('.ys.hot').forEach(s => s.classList.remove('hot')); }, 250); };
  el.addEventListener('pointermove', e => {
    if (!G) return;
    const y = yIn(e), it = hit(y);
    if (it.t === 'y') { bub.classList.remove('on'); if (pop.dataset.y != it.y || !pop.classList.contains('on')) showPop(it.y, y); else clearTimeout(hide); return; }
    if (pop.classList.contains('on')) hidePop();
    k = it.k; bub.textContent = mname(k); bub.style.top = vis(y) + 'px'; bub.classList.add('on');
  });
  el.addEventListener('pointerdown', e => { if (!G || hit(yIn(e)).t !== 'm') return; drag = true; el.setPointerCapture(e.pointerId); k = hit(yIn(e)).k; });
  el.addEventListener('pointerup', () => { if (!drag) return; drag = false; bub.classList.remove('on'); jumpTo(k); });
  el.addEventListener('pointerleave', () => { if (!drag) bub.classList.remove('on'); hidePop(); });
  pop.addEventListener('pointerenter', () => clearTimeout(hide));
  pop.addEventListener('pointerleave', hidePop);
  pop.addEventListener('click', e => { const m = e.target.closest('.mo'); if (m) { pop.classList.remove('on'); jumpTo(+m.dataset.mk); } });
})();

function renderPicker() {
  document.getElementById('picker')?.remove();
  if (!S.picker || S.v !== 'R1') return;
  const p = document.createElement('div'); p.id = 'picker';
  let html = '';
  for (let y = TODAY.getFullYear(); y >= SIGNUP.getFullYear(); y--) {
    html += `<div class="yr">${y}</div><div class="gr">`;
    for (let m = 0; m < 12; m++) {
      const k = y * 12 + m, ds = byMonth[k];
      html += `<div class="mo ${ds ? '' : 'off'} ${k === MONTHS[0] ? 'cur' : ''}" data-mk="${k}">${mname(k, { month: 'short' })}${ds ? `<i style="opacity:${ds.filter(written).length / ds.length}"></i>` : ''}</div>`;
    }
    html += '</div>';
  }
  p.innerHTML = html;
  p.onclick = e => { const m = e.target.closest('.mo'); if (m) { S.picker = false; jumpTo(+m.dataset.mk); } };
  document.getElementById('railwrap').appendChild(p);
}

function jumpTo(k) {
  const need = byMonth[k].at(-1).i + 1, rail = document.getElementById('rail');
  const go = () => {
    const h = rail.querySelector(`.month[data-mk="${k}"]`);
    if (h) rail.scrollTop = h.offsetTop - (S.v === 'R2' ? 8 : 0);
  };
  if (S.v !== 'R2') { // windowed: fetch from the target month, never the Days in between
    const first = byMonth[k][0].i, last = byMonth[k].at(-1).i;
    if (first >= S.from && last < S.loaded) { go(); return; }
    loading = true;
    setTimeout(() => { S.from = first; S.loaded = Math.max(last + 1, first + BATCH); loading = false; renderRail(); go(); markScrub(); updateBar(); }, 350); // pretend fetch
    return;
  }
  if (need <= S.loaded) { renderRail(); go(); return; }
  renderRail(); loading = true;
  setTimeout(() => { S.loaded = Math.ceil(need / BATCH) * BATCH; loading = false; renderRail(); go(); updateBar(); }, 350); // pretend fetch
}

function renderPage() {
  const day = days[S.sel], w = writable(day), text = day.pages[S.nb] || '';
  const lines = (text ? text.split('\n') : ['']).map(l => `<div>${l ? esc(l) : '<br>'}</div>`).join('');
  const badge = w ? (day.i === 1 ? '<span class="badge live">Still open until 02:00</span>' : '') : '<span class="badge">Read only</span>';
  document.getElementById('main').innerHTML = `
    <button id="hamb" title="Days"><svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg></button>
    <div class="sheet ${w ? '' : 'ro'} ${S.nb === 'My Journal' ? '' : 'notitle'}">
      <div class="head"><div class="dow">${fmt(day.date, { weekday: 'long' })}${day.i === 0 ? ' · Today' : ''}${badge}</div>
        <div class="date">${fmt(day.date, { day: 'numeric', month: 'long', year: 'numeric' })}</div></div>
      <div class="ed" ${w ? 'contenteditable="true" spellcheck="false"' : ''}>${lines}</div>
      <div class="tabs">${NBS.map(n => `<div class="tab ${n === S.nb ? 'on' : ''}" data-nb="${n}">${n}</div>`).join('')}</div>
    </div>`;
  document.getElementById('hamb').onclick = () => { S.dopen = true; renderShell(); };
  document.querySelectorAll('.tab[data-nb]').forEach(t => t.onclick = () => { S.nb = t.dataset.nb; renderPage(); });
  const ed = document.querySelector('.ed[contenteditable]');
  if (ed) ed.oninput = () => {
    if (!ed.firstElementChild) ed.innerHTML = '<div><br></div>';
    day.pages[S.nb] = ed.innerText.replace(/\n$/, '');
    renderRail();
  };
}

function select(i) { S.sel = i; S.dopen = false; renderShell(); renderRail(); renderPage(); }

document.getElementById('rail').onclick = e => {
  const slot = e.target.closest('.slot'), dot = e.target.closest('.dd'), mh = e.target.closest('.mh'), month = e.target.closest('.month');
  if (slot) return select(+slot.dataset.i);
  if (dot) { const d = days[+dot.dataset.i]; S.openMonths.add(d.k); S.monthLoaded.add(d.k); return select(d.i); }
  if (mh) {
    const k = +mh.parentElement.dataset.mk;
    if (S.openMonths.has(k)) S.openMonths.delete(k); else {
      S.openMonths.add(k);
      if (!S.monthLoaded.has(k)) setTimeout(() => { S.monthLoaded.add(k); renderRail(); }, 350); // pretend fetch of one month
    }
    return renderRail();
  }
  if (month && S.v === 'R1') { S.picker = !S.picker; renderPicker(); }
};
document.getElementById('scrim').onclick = () => { S.dopen = false; renderShell(); };

function renderNav() {
  const ic = d => `<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">${d}</svg>`;
  document.getElementById('navtop').innerHTML = `<div class="nav">
      <a class="on">${ic('<path d="M2 7.5 8 2.5l6 5V14H10v-4H6v4H2z"/>')}Home</a>
      <a>${ic('<circle cx="8" cy="8" r="5.5"/>')}Filler 1</a>
      <a>${ic('<circle cx="8" cy="8" r="5.5"/>')}Filler 2</a>
    </div>
    <label class="search"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" style="flex:none"><circle cx="7" cy="7" r="5"/><path d="m11 11 4 4"/></svg><input placeholder="Search"></label>
    <div class="navdiv"></div>`;
}
function renderShell() {
  document.getElementById('frame').className = S.narrow ? 'narrow' : '';
  document.getElementById('app').className = ['app', S.v, S.narrow ? 'narrow ' + S.drawer : '', S.dopen ? 'dopen' : ''].join(' ');
  const [, curve, dur] = EASES[S.ease], r = document.documentElement.style;
  r.setProperty('--hd', S.hd / 1000 + 's'); r.setProperty('--ease', curve); r.setProperty('--dur', dur);
  updateBar();
}
function updateBar() {
  document.getElementById('vn').textContent = `${S.v} · ${V[S.v]}`;
  document.getElementById('grace').textContent = S.grace ? 'Grace: on (01:12)' : 'Grace: off';
  document.getElementById('gm').textContent = `Marker: ${S.g}`;
  document.getElementById('narrow').textContent = S.narrow ? 'Window: 760px' : 'Window: wide';
  const dr = document.getElementById('drawer');
  dr.textContent = S.drawer === 'D1' ? 'Drawer: D1 slide-over' : 'Drawer: D2 mini rail'; dr.disabled = !S.narrow;
  document.getElementById('hd').textContent = `Hover delay: ${S.hd}ms`;
  document.getElementById('ease').textContent = `Motion: ${EASES[S.ease][0]}`;
  document.getElementById('hist').textContent = `History: ${S.years} years`;
  const sm = document.getElementById('smode'); sm.textContent = 'Scrubber: ' + SM[S.sm]; sm.disabled = S.v !== 'R4';
  document.getElementById('ld').textContent = S.v === 'R3' ? `${S.monthLoaded.size} / ${MONTHS.length} months loaded` : `Days ${S.from + 1}–${Math.min(S.loaded, days.length)} of ${days.length} loaded`;
}
function setVariant(v) {
  S.v = v; S.loaded = BATCH; S.from = 0; S.picker = false; S.g = { R1: 'dot', R2: 'ring', R3: 'bar', R4: 'dot' }[v];
  history.replaceState(null, '', '?variant=' + v);
  renderShell(); renderRail();
  const rail = document.getElementById('rail'); rail.scrollTop = v === 'R2' ? rail.scrollHeight : 0;
}
const cyc = n => setVariant(VK[(VK.indexOf(S.v) + n + VK.length) % VK.length]);
document.getElementById('prev').onclick = () => cyc(-1);
document.getElementById('next').onclick = () => cyc(1);
document.getElementById('vn').onclick = () => cyc(1);
document.getElementById('grace').onclick = () => { S.grace = !S.grace; renderShell(); renderRail(); renderPage(); };
document.getElementById('gm').onclick = () => { S.g = { dot: 'ring', ring: 'bar', bar: 'dot' }[S.g]; updateBar(); renderRail(); };
document.getElementById('labb').onclick = () => {
  const lab = document.getElementById('lab'), on = lab.classList.toggle('on');
  if (!on) return;
  lab.innerHTML = `<h3>Compare motion</h3><p>Same Islands, one motion curve per column, all with the ${S.hd}ms hover delay (change it on the bar). Hover each one. Esc or the button closes this.</p><div class="cols">` +
    LAB.map(([n, c, d, note]) => `<div class="col" style="--ease:${c};--dur:${d}"><h4>${n}</h4><small>${note} · ${d}</small>${[1, 2, 3, 6].map(i => island(days[i])).join('')}</div>`).join('') + '</div>';
};
document.getElementById('hist').onclick = () => {
  S.years = { 3: 10, 10: 25, 25: 3 }[S.years]; gen(S.years);
  S.sel = 0; S.openMonths = new Set([MONTHS[0]]); S.monthLoaded = new Set([MONTHS[0]]);
  renderPage(); setVariant(S.v);
};
document.getElementById('smode').onclick = () => { S.sm = { S1: 'S2', S2: 'S3', S3: 'S4', S4: 'S1' }[S.sm]; document.getElementById('scrub').scrollTop = 0; renderScrub(); markScrub(); updateBar(); };
document.getElementById('narrow').onclick = () => { S.narrow = !S.narrow; S.dopen = false; renderShell(); };
document.getElementById('drawer').onclick = () => { S.drawer = S.drawer === 'D1' ? 'D2' : 'D1'; S.dopen = false; renderShell(); };
document.getElementById('hd').onclick = () => { S.hd = { 0: 150, 150: 300, 300: 0 }[S.hd]; renderShell(); };
document.getElementById('ease').onclick = () => { S.ease = (S.ease + 1) % EASES.length; renderShell(); };
addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cyc(-1);
  if (e.key === 'ArrowRight') cyc(1);
  if (e.key === 'Escape') { document.getElementById('lab').classList.remove('on'); S.picker = false; S.dopen = false; renderPicker(); renderShell(); }
});
renderNav(); renderPage(); setVariant(S.v);
</script>
</body>
</html>
