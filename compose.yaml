services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: zoop
      POSTGRES_PASSWORD: zoop
      POSTGRES_DB: zoop
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoop -d zoop"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
