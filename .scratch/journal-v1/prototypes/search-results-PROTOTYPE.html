<!doctype html>
<!--
  PROTOTYPE, throwaway. VERDICT (2026-11-25): A + H2 + blue matches + Title on + dates searched as text; see the ticket's Answer.
  Ticket: "Search results UI" (.scratch/journal-v1/issues/14-search-results-ui.md)
  Built on the winner of island-rail-PROTOTYPE.html (R4: newest first, sticky month headers, Spring hover, D1 drawer).
  The scrubber is drawn but not interactive here; it isn't what this prototype is about.
  Plan: four structurally different placements, switchable via ?variant=A|B|C|D, the ← / → keys (outside inputs) or the bottom bar.
    A  Replace the rail: typing swaps the Island rail for a results list in the sidebar, grouped under sticky month headers.
       Results stay while you read the opened Page; Esc clears and the rail comes back on the opened Day.
    B  Dropdown: a popover under the search box, wider than the sidebar, overlapping the sheet. Opening a result closes it; the rail stays put.
    C  Search page over the sheet: the sidebar box opens a panel that covers the sheet, list on the left, full Page preview on the right.
    D  Spotlight: the sidebar box is a launcher; ⌘K opens a centred palette over everything.
  Fake API: GET /search?q&cursor → 20 results newest first, {day, notebook, snippet:[{text, match}]}, prefix match on every word (AND).
  Client: searches from 1 character, 200ms after typing stops, cancels the previous request. The bar counts requests sent / cancelled.
  Bar toggles: window (wide / 760px with the D1 drawer), latency, how the opened Page shows the match (H1 flash / H2 stay / H3 scroll only),
  and a Title line in results (not in the agreed API shape; on to judge whether it's worth adding). No persistence.
  Try: "mum", "bike ch", "octo", "soup leek", "zebra" (no results), then ↑ ↓ ↵ Esc, ⌘K.
-->

    : `<button class="search sbtn">${mag}<span>${S.q ? esc(S.q) : 'Search'}</span><kbd>⌘K</kbd></button>`;
  document.getElementById('navtop').innerHTML = `<div class="nav">
      <a class="on">${ic('<path d="M2 7.5 8 2.5l6 5V14H10v-4H6v4H2z"/>')}Home</a>
      <a>${ic('<circle cx="8" cy="8" r="5.5"/>')}Filler 1</a><a>${ic('<circle cx="8" cy="8" r="5.5"/>')}Filler 2</a></div>${box}<div class="navdiv"></div>`;
  const q = document.getElementById('q');
  if (q) { wireInput(q); q.value = S.q; q.addEventListener('focus', () => { if (S.v === 'B' && S.q) { S.bOpen = true; renderSearch(); } });
    document.querySelector('#navtop .clr').onclick = e => { e.preventDefault(); onQuery(''); q.focus(); }; }
  else document.querySelector('#navtop .sbtn').onclick = launch;
}
function renderShell() {
  document.getElementById('frame').className = S.narrow ? 'narrow' : '';
  document.getElementById('app').className = ['app', S.narrow ? 'narrow' : '', S.dopen ? 'dopen' : ''].join(' ');
}
function updateBar() {
  document.getElementById('vn').textContent = `${S.v} · ${V[S.v]}`;
  document.getElementById('narrow').textContent = S.narrow ? 'Window: 760px (drawer)' : 'Window: wide';
  document.getElementById('lat').textContent = `Latency: ${S.lat}ms`;
  document.getElementById('hlm').textContent = `Opened Page: ${S.hlm} ${HLM[S.hlm]}`;
  document.getElementById('ttl').textContent = `Title in results: ${S.title ? 'on' : 'off'}`;
  document.getElementById('hcol').textContent = `Match colour: ${S.hc}`;
  document.documentElement.className = 'hc-' + S.hc;
  document.getElementById('ld').textContent = `requests ${S.sent} · cancelled ${S.cancelled}`;
}
function setVariant(v) {
  S.v = v; S.bOpen = S.cOpen = S.mOpen = false;
  history.replaceState(null, '', '?variant=' + v);
  ['panelC', 'modalD'].forEach(id => document.getElementById(id).innerHTML = '');
  renderNav(); renderShell(); renderSearch(); updateBar();
}
const cyc = n => setVariant(VK[(VK.indexOf(S.v) + n + VK.length) % VK.length]);
document.getElementById('prev').onclick = () => cyc(-1);
document.getElementById('next').onclick = () => cyc(1);
document.getElementById('vn').onclick = () => cyc(1);
document.getElementById('narrow').onclick = () => { S.narrow = !S.narrow; S.dopen = false; S.bOpen = false; renderShell(); renderSearch(); updateBar(); setTimeout(renderScrub, 50); };
document.getElementById('lat').onclick = () => { S.lat = LATS[(LATS.indexOf(S.lat) + 1) % LATS.length]; updateBar(); };
document.getElementById('hlm').onclick = () => { S.hlm = { H1: 'H2', H2: 'H3', H3: 'H1' }[S.hlm]; S.hl = null; renderPage(); updateBar(); };
document.getElementById('hcol').onclick = () => { S.hc = S.hc === 'blue' ? 'yellow' : 'blue'; updateBar(); };
document.getElementById('ttl').onclick = () => { S.title = !S.title; renderSearch(); updateBar(); };
document.getElementById('rail').onclick = e => { const s = e.target.closest('.slot'); if (s) { S.sel = +s.dataset.i; S.hl = null; S.dopen = false; renderShell(); renderRail(); renderPage(); } };
document.getElementById('scrim').onclick = () => { S.dopen = false; renderShell(); };
['resA', 'dropB', 'panelC', 'modalD'].forEach(id => document.getElementById(id).addEventListener('click', e => {
  const ri = e.target.closest('.ri');
  if (ri) { const j = +ri.dataset.j; if (id === 'panelC') { S.active = j; renderSearch(); document.getElementById('cq').focus(); } else openRes(j); return; }
  if (id === 'modalD' && e.target.id === 'modalD') closeAll();
}));
document.getElementById('panelC').addEventListener('dblclick', e => { const ri = e.target.closest('.ri'); if (ri) openRes(+ri.dataset.j); });
document.addEventListener('pointerdown', e => {
  if (S.v === 'B' && S.bOpen && !e.target.closest('#dropB, #navtop .search, #bar')) { S.bOpen = false; renderSearch(); }
});
addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return launch(); }
  if (e.target.closest('input, textarea, [contenteditable]')) { if (e.key === 'Escape' && S.hl) clearHl(); return; }
  if (e.key === 'ArrowLeft') cyc(-1);
  if (e.key === 'ArrowRight') cyc(1);
  if (e.key === 'Escape') { if (S.hl) clearHl(); S.dopen = false; closeAll(); renderShell(); }
});
addEventListener('resize', renderScrub);
renderNav(); renderRail(); renderPage(); renderScrub(); setVariant(S.v);
</script>
</body>
</html>
