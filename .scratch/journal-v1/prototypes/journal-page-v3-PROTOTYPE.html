<!doctype html>
<!--
  PROTOTYPE (round 3), throwaway. Round 2 feedback: proportions off, tab divider ugly.
  Round 3e: T4 uses T2's inset index column for Notebooks (replaces the temporary segmented switch).
  Round 3d: rail lazy-loads Days in batches of 40 (fake 350ms latency); 150ms hover delay before an Island expands.
  Round 3c: T4 = placeholder nav (Home / Filler 1 / Filler 2 / Search) on top of a wider rail; Islands push neighbours down on hover;
  Notebook switch moved off the rail, shown temporarily as a segmented control on the sheet (placement still open). Tab treatments switchable via ?tabs=T1|T2|T3|T4, the ← / → keys or the bottom bar.
  Round 2 was: Ticket: "Journal page look and feel" (.scratch/journal-v1/issues/05-journal-page-prototype.md)
  Round 1 verdict: variant A (single sheet), but no ruled lines; minimal, modern, Apple-style; Island rail on the left.
  The rail here is a first sketch: its detailed behaviour belongs to the "Island rail and hover expansion" ticket.
  Bottom bar = prototype controls only: rail order, Grace Window on/off, 2 vs 5 Notebooks.
  No persistence; edits live in memory until reload.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zoop: journal page v3 PROTOTYPE</title>
<style>
  :root {
    --bg: #f5f5f7; --sheet: #ffffff; --ink: #1d1d1f; --ink2: #6e6e73; --ink3: #a1a1a6;
    --tab: #e8e8ed; --island: #0b0b0c; --spring: cubic-bezier(.32,1.25,.5,1);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  .app { display: flex; height: 100vh; }

  /* ---------- Island rail ---------- */
  .left { width: 300px; flex: none; height: 100%; display: flex; flex-direction: column; }
  .rail { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 12px 110px 18px;
    scrollbar-width: none; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 28px, #000 calc(100% - 60px), transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0, #000 28px, #000 calc(100% - 60px), transparent 100%); }
  .rail::-webkit-scrollbar { display: none; }
  .month { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink3); margin: 18px 0 8px 12px; }
  .slot { margin-bottom: 6px; }
  .isl { position: relative; width: 100%; min-height: 28px; border-radius: 14px; background: var(--island); color: #f5f5f7;
    cursor: pointer; overflow: hidden; z-index: 1;
    transition: width .45s var(--spring), border-radius .45s var(--spring), box-shadow .3s ease, transform .45s var(--spring); }
  .isl .row0 { display: flex; align-items: center; gap: 10px; height: 28px; padding: 0 12px; font-size: 12px; white-space: nowrap; }
  .isl .d { font-weight: 600; font-variant-numeric: tabular-nums; min-width: 40px; }
  .isl .sep { width: 1px; height: 12px; background: rgba(255,255,255,.22); flex: none; }
  .slot.empty .isl .sep { display: none; }
  .isl .t { color: #d2d2d7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  .isl .dot { width: 7px; height: 7px; border-radius: 50%; background: #30d158; flex: none; margin-left: auto; box-shadow: 0 0 6px #30d158; }
  .isl .more { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .42s cubic-bezier(.25,.8,.25,1), opacity .3s ease; }
  .isl .more > div { overflow: hidden; }
  .isl .nbrow { padding: 0 14px 10px; font-size: 12px; line-height: 1.4; }
  .isl .nbrow b { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #8e8e93; margin-bottom: 2px; }
  .isl .nbrow span { color: #e5e5ea; }
  .isl .open { padding: 0 14px 10px; font-size: 11px; color: #30d158; }
  .slot:hover .isl { border-radius: 18px; box-shadow: 0 6px 16px rgba(0,0,0,.14); transition-delay: .15s; }
  .slot:hover .isl .more { grid-template-rows: 1fr; opacity: 1; transition-delay: .15s; }
  .slot.empty .isl { background: #d8d8dd; color: #6e6e73; }
  .slot.empty .isl .t { display: none; }
  .loading .ph { height: 28px; border-radius: 14px; margin-bottom: 6px;
    background: linear-gradient(90deg, #e3e3e8 0%, #efeff3 50%, #e3e3e8 100%); background-size: 200% 100%; animation: shimmer 1.1s linear infinite; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .railend { text-align: center; font-size: 11px; color: var(--ink3); padding: 12px 0; }
  .slot.sel .isl { outline: 2px solid #0a84ff; outline-offset: 2px; }

  /* ---------- Page ---------- */
  .main { flex: 1; height: 100%; overflow-y: auto; display: flex; justify-content: center; padding: 24px 56px 120px 8px; }
  .T1 .main { padding-right: 170px; }
  .sheet { position: relative; width: 100%; max-width: 860px; min-height: calc(100vh - 48px); background: var(--sheet); border-radius: 18px;
    box-shadow: 0 1px 1px rgba(0,0,0,.03), 0 8px 28px rgba(0,0,0,.05); padding: 64px 96px 80px; }
  .T2 .sheet { padding-right: 140px; }
  .head { margin-bottom: 32px; }
  .dow { font-size: 12px; font-weight: 500; color: var(--ink3); margin-bottom: 3px; display: flex; align-items: center; gap: 10px; }
  .date { font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
  .badge { font-size: 11px; font-weight: 500; color: var(--ink2); background: var(--bg); padding: 3px 9px; border-radius: 999px; }
  .badge.live { color: #248a3d; background: #e3f6e8; }
  .ed { outline: none; white-space: pre-wrap; word-wrap: break-word; font-size: 17px; line-height: 1.65; color: var(--ink); min-height: 60vh; caret-color: #0a84ff; }
  .ed > div:first-child { font-size: 21px; font-weight: 650; letter-spacing: -.015em; line-height: 1.35; margin-bottom: 14px; }
  .ed:empty::before, .ed > div:only-child:has(br:only-child)::before { content: 'Title'; color: var(--ink3); }
  .ro .ed { color: #48484a; cursor: default; }
  .notitle .ed > div:first-child { font-size: 17px; font-weight: 400; letter-spacing: 0; line-height: 1.65; margin: 0; }

  /* Notebook tabs. T1: labels beside the sheet */
  .T1 .tabs { position: absolute; top: 64px; left: calc(100% + 14px); display: flex; flex-direction: column; gap: 2px; }
  .T1 .tab { padding: 6px 12px; border-radius: 8px; font-size: 13px; color: var(--ink2); white-space: nowrap; cursor: pointer; transition: background .2s, color .2s; }
  .T1 .tab:hover { color: var(--ink); background: rgba(0,0,0,.04); }
  .T1 .tab.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .T1 .tab.add { color: var(--ink3); }
  /* T2: index column inset in the sheet's right edge, behind a hairline */
  .T2 .tabs { position: absolute; top: 0; bottom: 0; right: 0; width: 52px; border-left: 1px solid #efeff2; display: flex; flex-direction: column; padding-top: 64px; }
  .T2 .tab { writing-mode: vertical-rl; padding: 16px 0; text-align: center; font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink3); cursor: pointer; transition: color .2s, box-shadow .3s var(--spring); }
  .T2 .tab:hover { color: var(--ink2); }
  .T2 .tab.on { color: var(--ink); font-weight: 650; box-shadow: inset 2px 0 0 var(--ink); }
  /* T4: Notebook buttons + search on top of the left rail */
  #navtop { display: none; }
  .T4 #navtop { display: block; padding: 22px 12px 6px 18px; }
  .nav { display: flex; flex-direction: column; gap: 1px; }
  .nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; font-size: 13.5px; color: var(--ink); text-decoration: none; cursor: pointer; }
  .nav a:hover { background: rgba(0,0,0,.05); }
  .nav a.on { background: rgba(0,0,0,.07); font-weight: 600; }
  .nav svg { color: var(--ink2); flex: none; }
  .navdiv { height: 1px; background: #e2e2e7; margin: 12px 4px 4px; }
  .seg { display: flex; flex-wrap: wrap; background: #e8e8ed; border-radius: 9px; padding: 2px; gap: 2px; }
  .seg .tab { flex: 1; text-align: center; padding: 5px 8px; border-radius: 7px; font-size: 12.5px; color: var(--ink2); cursor: pointer; white-space: nowrap; transition: background .2s, color .2s; }
  .seg .tab:hover { color: var(--ink); }
  .seg .tab.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  .search { margin-top: 8px; display: flex; align-items: center; gap: 6px; background: #e8e8ed; border-radius: 9px; padding: 6px 10px; color: var(--ink3); font-size: 12.5px; }
  .search input { border: 0; background: transparent; outline: none; font: inherit; color: var(--ink); width: 100%; }
  .T4 .rail { padding-top: 4px; }
  /* T3: Apple segmented control top-right of the sheet */
  .T3 .tabs { position: absolute; top: 28px; right: 32px; display: flex; background: #f0f0f3; border-radius: 9px; padding: 2px; }
  .T3 .tab { padding: 4px 12px; border-radius: 7px; font-size: 12.5px; color: var(--ink2); cursor: pointer; white-space: nowrap; }
  .T3 .tab.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  .T3 .tab.add { color: var(--ink3); }

  /* prototype controls (not part of the design) */
  #bar { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: rgba(30,30,32,.92); color: #fff; border-radius: 999px;
    display: flex; align-items: center; gap: 4px; padding: 6px; font: 500 12.5px system-ui, sans-serif; box-shadow: 0 6px 24px rgba(0,0,0,.3); z-index: 99; }
  #bar span { padding: 0 10px; color: #8e8e93; }
  #bar button { background: #3a3a3c; color: #fff; border: 0; border-radius: 999px; padding: 7px 12px; cursor: pointer; font: inherit; }
</style>
</head>
<body>
<div class="app" id="app"><aside class="left"><div id="navtop"></div><nav class="rail" id="rail"></nav></aside><main class="main" id="main"></main></div>
<div id="bar"><span>PROTOTYPE</span><button id="prev">←</button><button id="tv"></button><button id="next">→</button><button id="order"></button><button id="grace"></button><button id="nbs"></button><span id="ld"></span></div>
<script>
// ----- fake data: signup 1 Sep 2026 → today 25 Nov 2026 -----
const TODAY = new Date(2026, 10, 25), SIGNUP = new Date(2024, 0, 8);
const ALL_NBS = ['My Journal', 'I Learned', 'Dreams', 'Gratitude', 'Reading'];
const J = [
  ['Finally fixed the bike chain', 'Spent most of the morning with grease up to my elbows. It turned out the derailleur was bent, not the chain. Walked to the market after and bought too many clementines.'],
  ['Rain all day', 'Stayed in and read. Made soup from whatever was left in the fridge, which was mostly leeks.'],
  ['Long call with Mum', 'She is thinking about selling the house. I said nothing useful but listened, which seemed to be the point.'],
  ['First frost', 'The car windscreen was white at seven. Scraped it with a library card.'],
  ['Shipped the thing', 'Three weeks of work went out at 4pm and nobody noticed, which is the best possible outcome.'],
  ['Couldn\'t sleep', 'Up at 3 making a list of everything I have been putting off. The list was shorter than I feared.'],
  ['Swim', 'Forty lengths. The lane next to me had a man doing butterfly very slowly, like a sad dolphin.'],
];
const L = [
  'to_tsquery with :* matches prefixes, so "jour:*" finds journal and journey.',
  'Leeks need washing twice: grit hides between the layers near the root.',
  'Octopuses taste with their arms.',
  'chi middleware is just func(http.Handler) http.Handler.',
  'The Dynamic Island animates with a spring, not an ease curve.',
];
const days = [];
for (let d = new Date(TODAY), i = 0; d >= SIGNUP; d.setDate(d.getDate() - 1), i++) {
  const r = (i * 7919) % 13, has = i < 2 || r > 3, hasL = has && r % 3 !== 0;
  days.push({ date: new Date(d), i, pages: {
    'My Journal': has ? J[i % J.length].join('\n') : '',
    'I Learned': hasL ? 'Today I learned\n' + L[i % L.length] : '',
    'Dreams': has && r === 12 ? 'Flying over a car park\nIt was very ordinary up there.' : '',
  }});
}
const TV = { T1: 'Labels beside the sheet', T2: 'Inset index column', T3: 'Segmented control', T4: 'Nav on rail + inset index' }, TK = Object.keys(TV);
const q = new URLSearchParams(location.search).get('tabs');
const BATCH = 40;
let loading = false, io = null;
const S = { loaded: BATCH, tv: TK.includes(q) ? q : 'T4', sel: 0, nb: 'My Journal', newestFirst: true, grace: false, five: false };
const fmt = (d, o) => d.toLocaleDateString('en-GB', o);
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
const title = day => day.pages['My Journal'].split('\n')[0];
const nbs = () => S.five ? ALL_NBS : ALL_NBS.slice(0, 2);
const writable = day => day.i === 0 || (day.i === 1 && S.grace);
const glimpse = t => { const s = t.replace(/\n/g, ' · '); return s.length > 80 ? s.slice(0, 80).trimEnd() + '…' : s; };

function renderRail() {
  const all = S.newestFirst ? days : [...days].reverse();
  const list = all.slice(0, S.loaded);
  let html = '', month = '';
  for (const day of list) {
    const m = fmt(day.date, { month: 'long', year: 'numeric' });
    if (m !== month) { html += `<div class="month">${m}</div>`; month = m; }
    const filled = nbs().filter(n => day.pages[n]);
    const label = day.i === 0 ? 'Today' : fmt(day.date, { day: 'numeric', month: 'short' });
    html += `<div class="slot ${filled.length ? '' : 'empty'} ${day.i === S.sel ? 'sel' : ''}" data-i="${day.i}">
      <div class="isl">
        <div class="row0"><span class="d">${label}</span><span class="sep"></span><span class="t">${esc(title(day))}</span>${day.i === 1 && S.grace ? '<span class="dot"></span>' : ''}</div>
        <div class="more"><div>
          ${day.i === 1 && S.grace ? '<div class="open">Still open until 02:00</div>' : ''}
          ${filled.map(n => `<div class="nbrow"><b>${n}</b><span>${esc(glimpse(day.pages[n]))}</span></div>`).join('')}
        </div></div>
      </div></div>`;
  }
  html += S.loaded < all.length
    ? `<div class="loading" id="sentinel">${'<div class="ph"></div>'.repeat(3)}</div>`
    : `<div class="railend">${S.newestFirst ? 'You started here' : 'Today'}</div>`;
  const rail = document.getElementById('rail');
  rail.innerHTML = html;
  if (io) io.disconnect();
  const sentinel = document.getElementById('sentinel');
  if (sentinel) {
    io = new IntersectionObserver(es => {
      if (!es[0].isIntersecting || loading) return;
      loading = true;
      setTimeout(() => { S.loaded += BATCH; loading = false; renderRail(); updateBar(); }, 350); // pretend API page fetch
    }, { root: rail, rootMargin: '300px' });
    io.observe(sentinel);
  }
  rail.querySelectorAll('.slot').forEach(s => s.onclick = () => { S.sel = +s.dataset.i; render(); });
}

function renderPage() {
  const day = days[S.sel], w = writable(day), text = day.pages[S.nb] || '';
  const lines = (text ? text.split('\n') : ['']).map(l => `<div>${l ? esc(l) : '<br>'}</div>`).join('');
  const badge = w ? (day.i === 1 ? '<span class="badge live">Still open until 02:00</span>' : '') : '<span class="badge">Read only</span>';
  document.getElementById('main').innerHTML = `
    <div class="sheet ${w ? '' : 'ro'} ${S.nb === 'My Journal' ? '' : 'notitle'}">
      <div class="head"><div class="dow">${fmt(day.date, { weekday: 'long' })}${day.i === 0 ? ' · Today' : ''}${badge}</div>
        <div class="date">${fmt(day.date, { day: 'numeric', month: 'long', year: 'numeric' })}</div></div>
      <div class="ed" ${w ? 'contenteditable="true" spellcheck="false"' : ''}>${lines}</div>
      <div class="tabs">${nbs().map(n => `<div class="tab ${n === S.nb ? 'on' : ''}" data-nb="${n}">${n}</div>`).join('')}<div class="tab add" title="more Notebooks later">+</div></div>
    </div>`;
  document.querySelectorAll('.tab[data-nb]').forEach(t => t.onclick = () => { S.nb = t.dataset.nb; render(); });
  const ed = document.querySelector('.ed[contenteditable]');
  if (ed) ed.oninput = () => {
    if (!ed.firstElementChild) ed.innerHTML = '<div><br></div>';
    day.pages[S.nb] = ed.innerText.replace(/\n$/, '');
    renderRail();
  };
}

function updateBar() { document.getElementById('ld').textContent = `${Math.min(S.loaded, days.length)} / ${days.length} Days loaded`; }
function render() {
  if (!nbs().includes(S.nb)) S.nb = 'My Journal';
  document.getElementById('app').className = 'app ' + S.tv + (S.tv === 'T4' ? ' T2' : '');
  document.getElementById('tv').textContent = `${S.tv} (${TV[S.tv]})`;
  history.replaceState(null, '', '?tabs=' + S.tv);
  const ic = d => `<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">${d}</svg>`;
  document.getElementById('navtop').innerHTML = `<div class="nav">
      <a class="on">${ic('<path d="M2 7.5 8 2.5l6 5V14H10v-4H6v4H2z"/>')}Home</a>
      <a>${ic('<circle cx="8" cy="8" r="5.5"/>')}Filler 1</a>
      <a>${ic('<circle cx="8" cy="8" r="5.5"/>')}Filler 2</a>
    </div>
    <label class="search"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="7" r="5"/><path d="m11 11 4 4"/></svg><input placeholder="Search"></label>
    <div class="navdiv"></div>`;
  renderRail(); renderPage();
  document.getElementById('order').textContent = S.newestFirst ? 'Rail: newest first' : 'Rail: oldest first';
  document.getElementById('grace').textContent = S.grace ? 'Grace Window: on (00:00–02:00)' : 'Grace Window: off';
  document.getElementById('nbs').textContent = `${nbs().length} Notebooks`;
  updateBar();
}
document.getElementById('order').onclick = () => {
  S.newestFirst = !S.newestFirst; S.loaded = BATCH; render();
  const r = document.getElementById('rail'); r.scrollTop = S.newestFirst ? 0 : r.scrollHeight;
};
document.getElementById('grace').onclick = () => { S.grace = !S.grace; render(); };
document.getElementById('nbs').onclick = () => { S.five = !S.five; render(); };
const cyc = n => { S.tv = TK[(TK.indexOf(S.tv) + n + TK.length) % TK.length]; render(); };
document.getElementById('prev').onclick = () => cyc(-1);
document.getElementById('next').onclick = () => cyc(1);
document.getElementById('tv').onclick = () => cyc(1);
addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cyc(-1);
  if (e.key === 'ArrowRight') cyc(1);
});
render();
</script>
</body>
</html>
